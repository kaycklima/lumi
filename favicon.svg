<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .lumi-shell { fill: #0f172a; stroke: #38bdf8; stroke-width: 2.2; }
      .lumi-visor { fill: #020617; stroke: #1e293b; stroke-width: 1.5; }
      .lumi-eye { fill: #38bdf8; }
      .lumi-pupil { fill: #020617; }
      .lumi-catchlight { fill: #ffffff; }
      .lumi-smile { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; fill: none; }
      .lumi-cheek { fill: #fb7185; opacity: 0.75; }
      .lumi-stem { stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; }
      .lumi-bulb { fill: #38bdf8; }
      .lumi-ear { fill: #475569; }
      @media (prefers-color-scheme: light) {
        .lumi-shell { fill: #0f172a; stroke: #0284c7; stroke-width: 2.5; }
        .lumi-stem { stroke: #64748b; }
      }
    </style>
  </defs>

  <line x1="32" y1="6" x2="32" y2="14" class="lumi-stem"/>
  <circle cx="32" cy="6" r="4.5" class="lumi-bulb"/>
  <circle cx="31" cy="5" r="1.8" fill="#ffffff"/>

  <rect x="3" y="27" width="4.5" height="15" rx="2" class="lumi-ear"/>
  <rect x="56.5" y="27" width="4.5" height="15" rx="2" class="lumi-ear"/>

  <rect x="6" y="14" width="52" height="44" rx="14" class="lumi-shell"/>
  <rect x="11" y="19" width="42" height="34" rx="10" class="lumi-visor"/>

  <rect x="18" y="25" width="8" height="14" rx="4" class="lumi-eye"/>
  <circle cx="22" cy="32" r="2.5" class="lumi-pupil"/>
  <circle cx="23.5" cy="27.5" r="1.4" class="lumi-catchlight"/>

  <rect x="38" y="25" width="8" height="14" rx="4" class="lumi-eye"/>
  <circle cx="42" cy="32" r="2.5" class="lumi-pupil"/>
  <circle cx="43.5" cy="27.5" r="1.4" class="lumi-catchlight"/>

  <ellipse cx="15.5" cy="42" rx="2.5" ry="1.5" class="lumi-cheek"/>
  <ellipse cx="48.5" cy="42" rx="2.5" ry="1.5" class="lumi-cheek"/>

  <path d="M27 44 Q32 48.5 37 44" class="lumi-smile"/>
</svg>